framework:
    rate_limiter:
        # Throttles /api/forgot-password by client IP to prevent e-mail bombing
        # and blind enumeration attempts. Login is throttled separately via the
        # security firewall's login_throttling.
        password_reset:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        registration:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

services:
  proxy:
    build: ./proxy
    container_name: mybank_proxy
    restart: always
    environment:
      USER_DOMAIN: nexo-finance.duckdns.org
      ADMIN_DOMAIN: nexo-finance-admin.duckdns.org
      API_DOMAIN: nexo-finance-api.duckdns.org
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - frontend-admin

  certbot:
    image: certbot/certbot:v5.7.0
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/log:/var/log/letsencrypt

  certbot-dns:
    image: infinityofspace/certbot_dns_duckdns:v1.8.0
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/log:/var/log/letsencrypt
      - ./certbot/duckdns.ini:/conf/duckdns.ini:ro

  backend:
    build: .
    container_name: mybank_backend
    restart: always
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DEFAULT_URI: https://nexo-finance-api.duckdns.org
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./config/jwt:/var/www/html/config/jwt:ro
    depends_on:
      - database
      - mongodb

  frontend:
    build: ../frontend
    container_name: mybank_frontend
    restart: always
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  frontend-admin:
    build: ../frontend-admin
    container_name: mybank_frontend_admin
    restart: always
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: mybank_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mybank
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mybank_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mybank_phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - database

  mongodb:
    image: mongo:7
    container_name: mybank_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mybank_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mybank_logs
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

  mongo-express:
    image: mongo-express
    container_name: mybank_mongo_express
    restart: always
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_ADMIN_PASSWORD}
    depends_on:
      - mongodb


volumes:
  mybank_data:
  mybank_mongo_data:

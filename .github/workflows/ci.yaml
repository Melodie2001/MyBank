name: Nexo Finance CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # =====================
  # BACKEND (Symfony)
  # =====================
  symfony-tests:
    name: Backend — Symfony tests (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, intl, pdo_mysql, mongodb
          coverage: none

      - name: Create .env file
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0
        run: |
          cat <<EOF > .env
          APP_ENV=test
          APP_SECRET=test_secret
          APP_SHARE_DIR=var/share
          DEFAULT_URI=http://localhost
          FRONTEND_URL=http://localhost:5173
          GOOGLE_CLIENT_ID=ci_dummy_client_id
          GOOGLE_CLIENT_SECRET=ci_dummy_client_secret
          MYSQL_ROOT_PASSWORD=test_root_password
          DATABASE_URL="${DATABASE_URL}"
          MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
          MAILER_DSN=null://null
          LOCK_DSN=flock
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=test_passphrase
          MONGO_ROOT_USERNAME=test_mongo_admin
          MONGO_ROOT_PASSWORD=test_mongo_password
          MONGOEXPRESS_ADMIN_PASSWORD=test_mongoexpress_password
          MONGODB_URL=mongodb://localhost:27017/mybank_test
          MONGODB_DB=mybank_test
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          EOF

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Validate and audit Composer dependencies
        working-directory: backend
        run: |
          composer validate --no-check-publish
          composer audit --locked

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Create test database
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS mybank_test;"

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank"
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run Symfony unit tests
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank"
          APP_ENV: dev
        run: php vendor/bin/phpunit --testsuite "Project Test Suite"

      - name: Create test database
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
        run: php bin/console doctrine:database:create --env=test --no-interaction --if-not-exists

      - name: Run test migrations
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank_test"
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank_test"
        run: php vendor/bin/phpunit tests/Integration/

  # =====================
  # FRONTEND (React)
  # =====================
  frontend-tests:
    name: Frontend — React tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and audit frontend
        working-directory: frontend
        run: |
          npm run lint
          npm audit --audit-level=low

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # =====================
  # FRONTEND ADMIN
  # =====================
  frontend-admin-tests:
    name: Frontend Admin — React tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install frontend-admin dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Lint and audit frontend-admin
        working-directory: frontend-admin
        run: |
          npm run lint
          npm audit --audit-level=low

      - name: Run frontend-admin tests
        working-directory: frontend-admin
        run: npm run test:run

      - name: Build frontend-admin
        working-directory: frontend-admin
        run: npm run build

  # =====================
  # DEPLOYMENT CONFIGURATION
  # =====================
  deployment-config:
    name: Deployment — Docker Compose & nginx
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: test_mysql_password
      MONGO_ROOT_USERNAME: test_mongo_admin
      MONGO_ROOT_PASSWORD: test_mongo_password
      MONGOEXPRESS_ADMIN_PASSWORD: test_mongoexpress_password

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        working-directory: backend
        run: docker compose --profile tools config --quiet

      - name: Validate proxy bootstrap and HTTPS configurations
        working-directory: backend
        run: |
          set -eu
          sh -n proxy/docker-entrypoint.sh
          sh -n docker/entrypoint.sh
          bash -n scripts/deploy.sh scripts/backup-databases.sh
          mkdir -p certbot/conf certbot/www certbot/log
          docker compose build proxy

          # nginx must start before certificates exist so HTTP-01 can run.
          docker compose run --rm --no-deps proxy nginx -t

          # Exercise the conditional HTTPS template with disposable test certs.
          for domain in \
            nexo-finance.duckdns.org \
            nexo-finance-admin.duckdns.org \
            nexo-finance-api.duckdns.org
          do
            mkdir -p "certbot/conf/live/$domain"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj "/CN=$domain" \
              -keyout "certbot/conf/live/$domain/privkey.pem" \
              -out "certbot/conf/live/$domain/fullchain.pem"
          done

          docker compose run --rm --no-deps proxy nginx -t

  # Production deployment will be configured when the new server is available.

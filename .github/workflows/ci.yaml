name: Nexo Finance CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # =====================
  # BACKEND (Symfony)
  # =====================
  symfony-tests:
    name: Backend — Symfony tests (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, intl, pdo_mysql, mongodb
          coverage: none

      - name: Create .env file
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat <<EOF > .env
          APP_ENV=test
          APP_SECRET=test_secret
          DATABASE_URL="${DATABASE_URL}"
          JWT_PASSPHRASE=test_passphrase
          EOF

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Install PHPUnit
        working-directory: backend
        run: composer require --dev symfony/test-pack --no-interaction

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank"
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run Symfony unit tests
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank"
          APP_ENV: dev
        run: php bin/phpunit tests/Unit/

      - name: Create test database
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0"
        run: php bin/console doctrine:database:create --env=test --no-interaction

      - name: Run test migrations
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank_test"
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0"
          MONGODB_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "mybank_test"
        run: php bin/phpunit tests/Integration/ApiIntegrationTest.php

  # =====================
  # FRONTEND (React)
  # =====================
  frontend-tests:
    name: Frontend — React tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # =====================
  # FRONTEND ADMIN
  # =====================
  frontend-admin-tests:
    name: Frontend Admin — React tests & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install frontend-admin dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Run frontend-admin tests
        working-directory: frontend-admin
        run: npm run test:run

      - name: Build frontend-admin
        working-directory: frontend-admin
        run: npm run build

  # =====================
  # DEPLOY (production)
  # =====================
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: [symfony-tests, frontend-tests, frontend-admin-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/MyBank
            git pull origin main
            cd backend
            docker compose up -d --build
            docker exec mybank_backend php bin/console doctrine:migrations:migrate --no-interaction
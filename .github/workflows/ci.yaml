name: MyBank CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =====================
  # BACKEND (Symfony)
  # =====================
  symfony-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Install PHPUnit
        working-directory: backend
        run: composer require --dev symfony/test-pack --no-interaction

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run migrations
        working-directory: backend
        run: DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0" php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run Symfony unit tests
        working-directory: backend
        run: DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank?serverVersion=8.0" APP_ENV=dev php bin/phpunit tests/Unit/

      - name: Create test database
        working-directory: backend
        run: DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0" php bin/console doctrine:database:create --env=test --no-interaction

      - name: Run test migrations
        working-directory: backend
        run: DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0" php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run integration tests
        working-directory: backend
        run: DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0" php bin/phpunit tests/Integration/ApiIntegrationTest.php

  # =====================
  # FRONTEND (Vue/React)
  # =====================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # =====================
  # FRONTEND ADMIN
  # =====================
  frontend-admin-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install frontend-admin dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Run frontend-admin tests
        working-directory: frontend-admin
        run: npm run test:run

      - name: Build frontend-admin
        working-directory: frontend-admin
        run: npm run build
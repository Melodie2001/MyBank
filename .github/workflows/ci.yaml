name: Symfony CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  symfony-tests:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Copy .env
        run: cp backend/.env backend/.env.test

      - name: Configure test database
        run: |
          echo 'DATABASE_URL="mysql://root:root@127.0.0.1:3306/mybank_test?serverVersion=8.0"' >> backend/.env.test

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        working-directory: backend
        env:
          APP_ENV: test
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run Symfony tests
        working-directory: backend
        env:
          APP_ENV: test
        run: php bin/phpunit